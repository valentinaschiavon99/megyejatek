name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to update the "latest" pre-release with the APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build APK, compile UI tests, run unit tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: megyejatek-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/

      - name: Publish APK to the "latest" pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk megyejatek-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest megyejatek-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Ultima build (debug)" \
            --notes "APK di debug generato automaticamente dal commit ${GITHUB_SHA::7}. Scaricalo dal telefono e installalo."
