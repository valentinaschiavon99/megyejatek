name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly health check: catches dependency or toolchain rot even when nobody pushes.
    - cron: "17 4 * * 1"

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change
# what runs here. Dependabot keeps the pins up to date. setup-gradle also validates the
# Gradle wrapper checksum on every run.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Firebase config (optional)
        # Forks and PRs from forks have no secrets: they build the offline-only app.
        # The secret may hold the file base64-encoded or as plain JSON; a broken value only
        # turns Firebase off for this build (with a warning) instead of failing it.
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "No GOOGLE_SERVICES_JSON_B64 secret: building without accounts and online leaderboard."
            exit 0
          fi
          case "$GOOGLE_SERVICES_JSON_B64" in
            *"{"*) printf '%s' "$GOOGLE_SERVICES_JSON_B64" > app/google-services.json ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d ' \n\r' | base64 -d > app/google-services.json 2>/dev/null || true ;;
          esac
          if python3 -c "import json,sys; d=json.load(open('app/google-services.json')); assert d['client'][0]['client_info']['android_client_info']['package_name']=='io.github.valentinaschiavon99.megyejatek'" 2>/dev/null; then
            echo "Firebase enabled for this build."
          else
            rm -f app/google-services.json
            echo "::warning title=Firebase disabled::GOOGLE_SERVICES_JSON_B64 is not a valid google-services.json for this app; building without Firebase."
          fi

      - name: Release signing key (optional)
        # Without the secrets the release APK stays unsigned and the debug APK is published instead.
        env:
          KEYSTORE_B64: ${{ secrets.MEGYEJATEK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=No release key::MEGYEJATEK_KEYSTORE_BASE64 is not set; publishing the debug APK."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEGYEJATEK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs, compile UI tests, run unit tests
        # The run number becomes the versionCode, so the in-app update check can compare builds.
        env:
          MEGYEJATEK_KEYSTORE_PASSWORD: ${{ secrets.MEGYEJATEK_KEYSTORE_PASSWORD }}
          MEGYEJATEK_KEY_ALIAS: ${{ secrets.MEGYEJATEK_KEY_ALIAS }}
          # PKCS12 keystores use one password for the store and the key.
          MEGYEJATEK_KEY_PASSWORD: ${{ secrets.MEGYEJATEK_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew assembleDebug assembleRelease bundleRelease assembleDebugAndroidTest testDebugUnitTest --stacktrace
          -PversionCode=${{ github.run_number }} -PgitSha=${{ github.sha }}

      - name: Collect APKs
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/megyejatek-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk apk/megyejatek.apk
            # The bundle Google Play wants, signed with the same (upload) key.
            cp app/build/outputs/bundle/release/app-release.aab apk/megyejatek.aab
          fi
          ls -l apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megyejatek-apk
          path: apk/
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: app/build/reports/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Android lint
        run: ./gradlew lintDebug --continue

      - name: Upload lint results to code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
          category: android-lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  ui-tests:
    # Runs the Compose UI tests on an emulator (offline debug build), then smoke-tests the release
    # APK from "build". Separate from "publish", so a flaky emulator never blocks publishing.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # only to push the README screenshots to the "screenshots" branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: megyejatek-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compose UI tests on an API 35 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6 # 1080×2400, so the README screenshots are sharp
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest --stacktrace && bash tools/release_smoke.sh apk/megyejatek.apk

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-reports
          path: app/build/reports/androidTests/

      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screenshots
          find app/build/outputs/connected_android_test_additional_output -name '*.png' -exec cp {} screenshots/ \; || true
          ls -l screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Show failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{(bad.get('message') or '')[:300]}")
                      print((bad.text or "")[:2500])
          EOF

      - name: Publish screenshots to the "screenshots" branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          if ! ls *.png >/dev/null 2>&1; then echo "No screenshots"; exit 0; fi
          git init -q -b screenshots
          git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  publish:
    # Only pushes to main update the downloadable APK; PRs and scheduled runs never publish.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the "latest" pre-release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: megyejatek-apk

      - name: Publish APK to the "latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # The signed, optimised release build when the key is configured; the debug build otherwise.
          if [ -f megyejatek.apk ]; then MAIN=megyejatek.apk; KIND=release; else MAIN=megyejatek-debug.apk; KIND=debug; fi
          shopt -s nullglob
          FILES=(megyejatek*.apk megyejatek*.aab)
          sha256sum "${FILES[@]}" > SHA256SUMS
          sha256sum "$MAIN" > "$MAIN.sha256"
          # Read by the app's update check.
          MAIN="$MAIN" python3 - <<'PY'
          import json, os
          run = int(os.environ["RUN_NUMBER"])
          main = os.environ["MAIN"]
          json.dump({
              "versionCode": run,
              "versionName": f"0.{run}",
              "sha": os.environ["SHA"][:7],
              "apkUrl": f"https://github.com/{os.environ['GH_REPO']}/releases/download/latest/{main}",
              "sha256": open(main + ".sha256").read().split()[0],
          }, open("version.json", "w"))
          PY
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${FILES[@]}" "$MAIN.sha256" SHA256SUMS version.json \
            --prerelease \
            --target "$SHA" \
            --title "Ultima build" \
            --notes "Build automatica dal commit ${SHA::7}. Scarica **$MAIN** ($KIND). Se avevi installato una vecchia versione debug, disinstallala una volta prima di installare questa: la firma è cambiata. SHA256SUMS serve a verificare i download."
