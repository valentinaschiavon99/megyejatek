name: Map data

# Rebuilds app/src/main/assets/map/ from OpenStreetMap (Overpass), the KSH table in tools/data/
# and Natural Earth, whenever the pipeline or its inputs change. The result is pushed to the
# "map-data" branch for review and merging; this workflow never writes to main.
on:
  push:
    branches: [main]
    paths:
      - tools/build_data.py
      - tools/data/**
      - tools/neighbour_overrides.json
      - tools/requirements.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the map-data branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pipeline dependencies
        run: pip install -r tools/requirements.txt

      - name: Fetch sources (OSM, Natural Earth, KSH)
        run: python tools/build_data.py fetch --ksh "$(ls tools/data/hnt_letoltes_*.xlsx | sort | tail -1)"

      - name: Build assets
        shell: bash # with pipefail, so a failed build is not hidden by tee
        run: python tools/build_data.py build 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: map-data-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Push the result to the map-data branch
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git switch -c map-data
          git add app/src/main/assets/map
          if git diff --cached --quiet; then
            echo "Map data unchanged."
            exit 0
          fi
          git commit -m "feat(data): regenerate map data from OSM and KSH" -m "Built by the Map data workflow from ${SHA::7}."
          git push --force origin map-data
